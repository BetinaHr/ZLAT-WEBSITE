media:
  input: public/images
  output: images
  extensions: [jpg, jpeg, png, webp]
  categories: [image]
  rename: safe

settings:
  content:
    merge: true
  commit:
    identity: user
    templates:
      create: "content: add {path}"
      update: "content: update {path}"
      delete: "content: remove {path}"
      rename: "content: rename {oldPath} to {newPath}"

content:
  - name: homepage
    label: "Начална страница"
    type: file
    path: src/content/pages/home.json
    format: json
    operations:
      create: false
      rename: false
      delete: false
    fields:
      - name: hero
        label: "Основна секция"
        type: object
        required: true
        fields:
          - name: heading
            label: "Основно заглавие"
            type: string
            required: true
          - name: description
            label: "Описание"
            type: text
            required: true
          - name: primaryButtonLabel
            label: "Текст на бутон „Услуги“"
            type: string
            required: true
          - name: secondaryButtonLabel
            label: "Текст на бутон „Контакти“"
            type: string
            required: true
          - name: image
            label: "Изображение"
            type: image
            required: true
            description: "Препоръчително съотношение 4:3 и размер до 1600 × 1200 px."
            options:
              path: uploads
              extensions: [jpg, jpeg, png, webp]
              rename: safe
          - name: imageAlt
            label: "Alt текст на изображението"
            type: string
            required: true
            description: "Кратко и конкретно описание за достъпност и търсачки."
          - name: imageHeading
            label: "Заглавие върху изображението"
            type: string
            required: true
          - name: imageDescription
            label: "Описание върху изображението"
            type: text
            required: true
      - name: seo
        label: "SEO настройки"
        type: object
        required: true
        fields:
          - name: title
            label: "SEO заглавие"
            type: string
            required: true
            description: "Заглавието, което се показва в браузъра и резултатите от търсене."
          - name: description
            label: "Meta description"
            type: text
            required: true
          - name: keywords
            label: "Ключови думи"
            type: string
      - name: servicesPreview
        label: "Секция „Услуги“"
        type: object
        required: true
        fields:
          - name: heading
            label: "Заглавие"
            type: string
            required: true
          - name: description
            label: "Описание"
            type: text
            required: true
          - name: buttonLabel
            label: "Текст на бутоните"
            type: string
            required: true
          - name: items
            label: "Карти с услуги"
            type: object
            required: true
            list:
              min: 3
              max: 3
              collapsible:
                collapsed: true
                summary: "{marker} — {title}"
            fields:
              - name: marker
                label: "Номер"
                type: string
                required: true
              - name: title
                label: "Заглавие"
                type: string
                required: true
              - name: description
                label: "Описание"
                type: text
                required: true
      - name: galleryPreview
        label: "Секция „Галерия“"
        type: object
        required: true
        fields:
          - name: heading
            label: "Заглавие"
            type: string
            required: true
          - name: description
            label: "Описание"
            type: text
            required: true
          - name: buttonLabel
            label: "Текст на бутона"
            type: string
            required: true
          - name: items
            label: "Изображения"
            type: object
            required: true
            list:
              min: 4
              max: 4
              collapsible:
                collapsed: true
                summary: "{title}"
            fields:
              - name: title
                label: "Заглавие"
                type: string
                required: true
              - name: image
                label: "Изображение"
                type: image
                required: true
                description: "Препоръчително съотношение 4:3."
                options:
                  path: uploads
                  extensions: [jpg, jpeg, png, webp]
                  rename: safe
              - name: imageAlt
                label: "Alt текст"
                type: string
                required: true
      - name: aboutPreview
        label: "Секция „За нас“"
        type: object
        required: true
        fields:
          - name: heading
            label: "Заглавие"
            type: string
            required: true
          - name: description
            label: "Описание"
            type: text
            required: true
          - name: buttonLabel
            label: "Текст на бутона"
            type: string
            required: true
          - name: trustPoints
            label: "Акценти"
            type: string
            required: true
            list:
              min: 3
              max: 3
          - name: image
            label: "Изображение"
            type: image
            required: true
            description: "Препоръчително съотношение 16:10."
            options:
              path: uploads
              extensions: [jpg, jpeg, png, webp]
              rename: safe
          - name: imageAlt
            label: "Alt текст"
            type: string
            required: true
      - name: contactPreview
        label: "Контактна секция"
        type: object
        required: true
        fields:
          - name: eyebrow
            label: "Малък надпис"
            type: string
            required: true
          - name: heading
            label: "Заглавие"
            type: string
            required: true
          - name: description
            label: "Описание"
            type: text
            required: true
          - name: contactLine
            label: "Ред за контакт"
            type: string
            required: true
          - name: buttonLabel
            label: "Текст на бутона"
            type: string
            required: true
